# Arquivo: pages.yml | Função: publicar a página estática no GitHub Pages.
name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4